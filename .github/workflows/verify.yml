name: Security build verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - rebuild/bdx-native-admin-adjustments

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static security contracts
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
