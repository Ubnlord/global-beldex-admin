name: Bootstrap admin dependency lockfile
on:
  push:
    branches:
      - rebuild/bdx-native-admin-adjustments
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/bdx-native-admin-adjustments
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate reproducible lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo 'Lockfile already exists; nothing to do.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if [ ! -f package-lock.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: pin admin console dependencies'
          git push origin HEAD:rebuild/bdx-native-admin-adjustments
